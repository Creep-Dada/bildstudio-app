<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="light dark">
<title>Bildstudio</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Bildstudio – the same colours as CutForge (near-black stage, red #ff2d55 and turquoise #18e4d6), its own language:
   CutForge splits light like a lens (RGB shift, glitch); Bildstudio develops pictures – things appear out of a soft
   blur like an image out of noise, a prism iris turns, headings are set like a gallery catalogue. */
:root {
  --bg: #08090b; --bg2: rgba(255,255,255,.045); --bg3: rgba(255,255,255,.085); --solid: #111317; --text: #f4f4f2; --hint: #8a8f98;
  --line: rgba(255,255,255,.085); --red: #ff2d55; --cyan: #18e4d6; --violet: #a24bff;
  --red-a: rgba(255,45,85,.26); --cyan-a: rgba(24,228,214,.18); --glow: 0 0 26px rgba(255,45,85,.16), 0 0 26px rgba(24,228,214,.14);
  --prism: conic-gradient(from var(--turn, 0deg), var(--red), var(--violet), var(--cyan), #ffd36e, var(--red));
  --radius: 22px; --ease: cubic-bezier(.2, .8, .2, 1); --soft: cubic-bezier(.22, 1, .36, 1);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  --serif: "Iowan Old Style", "New York", "Palatino Linotype", Palatino, Georgia, serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-tg]) { --bg: #f5f5f2; --bg2: rgba(0,0,0,.035); --bg3: rgba(0,0,0,.065); --solid: #ffffff; --text: #111214; --hint: #6a6f78;
    --line: rgba(0,0,0,.08); --red: #e8164a; --cyan: #06a196; --red-a: rgba(232,22,74,.14); --cyan-a: rgba(6,161,150,.12); }
}
:root[data-light] { --red: #e8164a; --cyan: #06a196; --red-a: rgba(232,22,74,.14); --cyan-a: rgba(6,161,150,.12); }
@property --turn { syntax: "<angle>"; inherits: true; initial-value: 0deg; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15.5px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; overflow-x: hidden; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

/* ---------- the stage: a slowly turning prism sun behind frosted dark, and fine grain on top ---------- */
.sun { position: fixed; z-index: 0; left: 50%; top: -38vh; width: 150vw; max-width: 900px; aspect-ratio: 1; transform: translateX(-50%);
  border-radius: 50%; background: var(--prism); filter: blur(70px) saturate(1.2); opacity: .30; pointer-events: none;
  animation: turn 26s linear infinite; }
:root[data-light] .sun, :root:not([data-tg]) .sun { opacity: .22; }
@keyframes turn { to { --turn: 360deg; } }
.grain { position: fixed; inset: -50%; z-index: 0; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: grain 1.2s steps(6) infinite; }
@keyframes grain { 0% { transform: translate(0, 0); } 20% { transform: translate(-4%, 3%); } 40% { transform: translate(3%, -5%); }
  60% { transform: translate(-6%, -2%); } 80% { transform: translate(5%, 4%); } 100% { transform: translate(0, 0); } }
.page { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; padding: 18px 18px 10px; }

/* ---------- appearing: out of a blur, like a picture out of noise ---------- */
.dev { animation: develop .9s var(--soft) backwards; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes develop { from { opacity: 0; filter: blur(14px); transform: scale(.97); } }
.leave { animation: dissolve .32s var(--ease) forwards; }
@keyframes dissolve { to { opacity: 0; filter: blur(12px); transform: scale(1.02); } }

/* ---------- header: the iris and the wordmark ---------- */
header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.iris { position: relative; width: 34px; height: 34px; border-radius: 50%; background: var(--prism); animation: turn 9s linear infinite;
  box-shadow: var(--glow); flex: none; }
.iris::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--bg); transition: inset .6s var(--soft); }
.iris::after { content: ""; position: absolute; inset: 13px; border-radius: 50%; background: var(--text); opacity: .9; }
body.busy .iris::before { inset: 4px; }
.word { font-family: var(--serif); font-size: 25px; letter-spacing: -.01em; line-height: 1; }
.word b { font-family: var(--sans); font-weight: 800; letter-spacing: -.03em; }
.tag { margin-left: auto; font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--hint); }

/* ---------- home: the idea ---------- */
h1 { font-family: var(--serif); font-weight: 400; font-size: 36px; line-height: 1.08; letter-spacing: -.02em; margin: 6px 0 12px; }
h1 em { font-style: italic; background: var(--prism); -webkit-background-clip: text; background-clip: text; color: transparent; animation: turn 12s linear infinite; }
.lead { color: var(--hint); margin: 0 0 20px; }
.canvas { position: relative; border-radius: var(--radius); padding: 1.5px; background: var(--prism); animation: turn 14s linear infinite;
  box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.canvas-in { border-radius: calc(var(--radius) - 1.5px); background: var(--solid); padding: 16px 16px 14px; }
textarea { width: 100%; min-height: 128px; border: 0; outline: none; resize: none; background: transparent; font-size: 18px; line-height: 1.4; }
textarea::placeholder, input::placeholder { color: var(--hint); }
.counter { text-align: right; font-size: 12px; color: var(--hint); }
.examples { display: flex; gap: 8px; overflow-x: auto; padding: 16px 2px 4px; margin: 0 -18px; padding-left: 18px; scrollbar-width: none; }
.examples::-webkit-scrollbar { display: none; }
.examples button { flex: none; border: 1px solid var(--line); background: var(--bg2); border-radius: 999px; padding: 8px 14px; font-size: 13.5px;
  transition: transform .4s var(--soft), border-color .3s; }
.examples button:active { transform: scale(.94); }
.steps { margin-top: 30px; display: grid; gap: 2px; }
.step { display: flex; gap: 14px; align-items: flex-start; padding: 12px 4px; }
.step i { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 700;
  border: 1px solid var(--line); background: var(--bg2); position: relative; }
.step i::after { content: ""; position: absolute; left: 50%; top: 32px; width: 1px; height: 26px; background: linear-gradient(var(--line), transparent); }
.step:last-child i::after { display: none; }
.step b { display: block; font-weight: 650; }
.step span { color: var(--hint); font-size: 13.5px; }

/* ---------- shared pieces: formats, segments, the main button, the „sent“ screen ---------- */
h2 { font-family: var(--serif); font-weight: 400; font-size: 29px; line-height: 1.12; letter-spacing: -.015em; margin: 14px 0 6px; }
.note { color: var(--hint); font-size: 13px; margin: 0 0 4px; }
.label { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--hint); margin: 24px 2px 10px; }
.formats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.fmt { border: 1px solid var(--line); background: var(--bg2); border-radius: 16px; padding: 12px 4px 9px; display: flex; flex-direction: column;
  align-items: center; gap: 7px; position: relative; transition: transform .45s var(--soft), border-color .3s, box-shadow .3s; }
.fmt:active { transform: scale(.93); }
.fmt .shape { border: 1.5px solid var(--hint); border-radius: 4px; transition: all .45s var(--soft); }
.fmt small { font-size: 11px; color: var(--hint); }
.fmt.on { border-color: var(--cyan); box-shadow: 0 0 0 3px var(--cyan-a); }
.fmt.on .shape { border-color: var(--text); background: linear-gradient(135deg, var(--red-a), var(--cyan-a)); }
.models { display: grid; gap: 8px; }
.seg { display: flex; gap: 6px; padding: 4px; border-radius: 16px; background: var(--bg2); border: 1px solid var(--line); }
.seg button { flex: 1; border: 0; background: none; border-radius: 12px; padding: 10px 6px; font-size: 13.5px; color: var(--hint);
  transition: background .35s var(--ease), color .3s; }
.seg button.on { background: var(--text); color: var(--bg); font-weight: 650; }
.count { display: flex; align-items: center; gap: 16px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { border: 1px solid var(--line); background: var(--bg2); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.quick button.on { border-color: var(--cyan); color: var(--cyan); }
.go { position: fixed; z-index: 7; left: 18px; right: 18px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 584px; margin: 0 auto;
  height: 56px; border: 0; border-radius: 18px; color: #fff; font-weight: 700; font-size: 16px; overflow: hidden; isolation: isolate;
  background: #16181d; box-shadow: 0 12px 36px rgba(0,0,0,.4), var(--glow); transition: transform .4s var(--soft), opacity .3s; }
.go::before { content: ""; position: absolute; inset: -60%; z-index: -2; background: var(--prism); animation: turn 5s linear infinite; }
.go::after { content: ""; position: absolute; inset: 2px; z-index: -1; border-radius: 16px; background: linear-gradient(180deg, #1b1d23, #0f1014); }
.go:active { transform: scale(.97); }
.go:disabled { opacity: .45; }
.sent { text-align: center; padding: 70px 10px; }
.sent .iris { width: 74px; height: 74px; margin: 0 auto 20px; }
.sent .iris::before { inset: 14px; } .sent .iris::after { inset: 27px; }
.outside { margin-top: 26px; font-size: 13px; color: var(--hint); border: 1px dashed var(--line); border-radius: 16px; padding: 14px; }
.outside code { display: block; margin-top: 8px; word-break: break-all; font-size: 11.5px; color: var(--text); }

/* ---------- tabs: a pill row at the top (CutForge has a bottom bar) – a prism line glides under the chosen one ---------- */
.tabs { position: relative; display: flex; gap: 4px; padding: 4px; margin: 0 0 18px; border-radius: 999px; background: var(--bg2);
  border: 1px solid var(--line); }
.tabs button { position: relative; z-index: 1; flex: 1; border: 0; background: none; padding: 9px 4px; border-radius: 999px; font-size: 14px;
  color: var(--hint); font-weight: 600; transition: color .35s; }
.tabs button.on { color: var(--text); }
.tabs .pill { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 999px; background: var(--bg3);
  transition: transform .55s var(--soft), width .55s var(--soft); }
.tabs .pill::after { content: ""; position: absolute; left: 30%; right: 30%; bottom: 3px; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, var(--red), var(--violet), var(--cyan)); }

/* ---------- effects: search, category chips, a gallery wall of previews ---------- */
.search { position: relative; }
.search input { width: 100%; height: 46px; border-radius: 16px; border: 1px solid var(--line); background: var(--bg2); padding: 0 16px 0 42px;
  outline: none; transition: border-color .3s, box-shadow .3s; }
.search input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px var(--cyan-a); }
.search svg { position: absolute; left: 14px; top: 14px; color: var(--hint); }
.cats { display: flex; gap: 7px; overflow-x: auto; margin: 12px -18px 16px; padding: 2px 18px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cats button { flex: none; border: 1px solid var(--line); background: var(--bg2); border-radius: 999px; padding: 8px 13px; font-size: 13.5px;
  transition: background .35s var(--ease), color .3s, border-color .3s, transform .4s var(--soft); }
.cats button:active { transform: scale(.93); }
.cats button.on { background: var(--text); color: var(--bg); border-color: transparent; font-weight: 650; }
.count-note { color: var(--hint); font-size: 12.5px; margin: -6px 2px 10px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card { position: relative; padding: 0; border: 0; border-radius: 18px; overflow: hidden; background: var(--bg2); text-align: left;
  aspect-ratio: 1; isolation: isolate; animation: develop .8s var(--soft) backwards; animation-delay: calc(var(--i, 0) * 45ms);
  transition: transform .45s var(--soft); box-shadow: 0 0 0 1px var(--line); }
.card:active { transform: scale(.95); }
.card .ph { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 30% 20%, var(--red-a), transparent 60%),
  radial-gradient(circle at 80% 90%, var(--cyan-a), transparent 60%), var(--solid); }
.card .ph img { width: 100%; height: 100%; object-fit: cover; opacity: 0; filter: blur(16px) saturate(.4); transform: scale(1.08);
  transition: opacity .9s var(--ease), filter 1.1s var(--soft), transform 1.1s var(--soft); }
.card .ph img.in { opacity: 1; filter: none; transform: none; }
.card .emo { font-size: 42px; }
.card .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 11px 10px; background: linear-gradient(transparent, rgba(0,0,0,.78));
  color: #fff; display: flex; flex-direction: column; gap: 1px; }
.card .cap b { font-size: 13.5px; font-weight: 650; line-height: 1.2; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
.card .cap small { font-size: 11px; opacity: .8; }
.card .heart { position: absolute; top: 8px; right: 9px; font-style: normal; color: var(--red); text-shadow: 0 0 10px rgba(0,0,0,.5); }
.empty { color: var(--hint); text-align: center; padding: 40px 0; grid-column: 1 / -1; }

/* ---------- the effect sheet: rises from below, the wall behind darkens ---------- */
.veil { position: fixed; inset: 0; z-index: 5; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .4s var(--ease); }
.veil.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; border-radius: 26px 26px 0 0; background: var(--bg);
  transform: translateY(105%); transition: transform .6s var(--soft); padding: 0 0 calc(100px + env(safe-area-inset-bottom));
  box-shadow: 0 -20px 60px rgba(0,0,0,.45); overscroll-behavior: contain; }
.sheet.open { transform: none; }
.sheet .hero { position: relative; aspect-ratio: 1; max-height: 52vh; width: 100%; overflow: hidden; }
.sheet .hero img { width: 100%; height: 100%; object-fit: cover; animation: develop 1.1s var(--soft) backwards; }
.sheet .hero .emo { height: 100%; display: grid; place-items: center; font-size: 90px; background: var(--solid); }
.sheet .hero::after { content: ""; position: absolute; inset: auto 0 0 0; height: 40%; background: linear-gradient(transparent, var(--bg)); }
.sheet .close { position: absolute; z-index: 2; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 0;
  background: rgba(0,0,0,.45); color: #fff; font-size: 18px; backdrop-filter: blur(8px); }
.sheet .body { padding: 0 20px; margin-top: -30px; position: relative; z-index: 1; max-width: 620px; margin-left: auto; margin-right: auto; }
.sheet h2 { margin: 0 0 4px; }
.meta { color: var(--hint); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.fav { margin-left: auto; border: 1px solid var(--line); background: var(--bg2); border-radius: 999px; padding: 6px 12px; font-size: 13px;
  transition: transform .45s var(--soft); }
.fav.on { color: var(--red); border-color: var(--red-a); }
.fav:active { transform: scale(.9); }
.hints { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.hints li { display: flex; gap: 10px; font-size: 14px; }
.hints li i { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px;
  font-weight: 700; background: var(--prism); color: #fff; }
.param { width: 100%; margin-top: 6px; border: 1px solid var(--line); background: var(--bg2); border-radius: 14px; padding: 12px 14px; outline: none; }
.param:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px var(--cyan-a); }
.how { margin-top: 18px; font-size: 13px; color: var(--hint); display: flex; gap: 8px; align-items: center; }
.how b { color: var(--text); font-weight: 600; }
body.sheet-open { overflow: hidden; }

/* ---------- ⚙️ settings: calm grouped rows, like a phone's own settings ---------- */
.tabs button.gear { flex: 0 0 52px; font-size: 16px; }
.group { margin-top: 22px; }
.group > .label { margin: 0 4px 8px; }
.rows { border-radius: 18px; background: var(--bg2); border: 1px solid var(--line); overflow: hidden; }
.srow { padding: 14px 15px; display: grid; gap: 10px; }
.srow + .srow { border-top: 1px solid var(--line); }
.srow .head { display: flex; align-items: center; gap: 12px; }
.srow .head b { font-weight: 600; font-size: 15px; }
.srow .head small { display: block; color: var(--hint); font-size: 12.5px; margin-top: 2px; font-weight: 400; }
.srow .head .txt { flex: 1; min-width: 0; }
.switch { appearance: none; -webkit-appearance: none; flex: none; width: 50px; height: 30px; border-radius: 999px; background: var(--bg3);
  position: relative; margin: 0; transition: background .35s var(--ease); cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .5s var(--soft); }
.switch:checked { background: linear-gradient(90deg, var(--red), var(--violet), var(--cyan)); }
.switch:checked::after { transform: translateX(20px); }
.choice { display: grid; gap: 8px; }
.choice button { text-align: left; border: 1px solid var(--line); background: transparent; border-radius: 14px; padding: 11px 13px;
  display: flex; gap: 11px; align-items: center; transition: border-color .3s, box-shadow .3s, transform .4s var(--soft); }
.choice button:active { transform: scale(.98); }
.choice button .dot { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--hint); position: relative; }
.choice button.on { border-color: var(--cyan); box-shadow: 0 0 0 3px var(--cyan-a); }
.choice button.on .dot { border-color: transparent; background: var(--prism); }
.choice button.on .dot::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: #fff; }
.choice button b { font-weight: 600; font-size: 14.5px; }
.choice button small { display: block; color: var(--hint); font-size: 12px; margin-top: 1px; }
.account { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
.account div { background: var(--solid); padding: 13px 15px; }
.account b { display: block; font-family: var(--serif); font-size: 24px; font-weight: 400; line-height: 1.1; }
.account small { color: var(--hint); font-size: 12px; }
.fold { overflow: hidden; transition: max-height .5s var(--soft), opacity .4s; max-height: 120px; }
.fold.shut { max-height: 0; opacity: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="sun" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<main class="page">
  <header class="dev"><span class="iris"></span><span class="word">Bild<b>studio</b></span><span class="tag" id="tag"></span></header>
  <nav class="tabs dev hidden" id="tabs"><i class="pill"></i><button data-tab="effects">✨ Effekte</button><button data-tab="idea">💡 Idee</button><button data-tab="create">🎨 Erstellen</button><button data-tab="settings" class="gear" aria-label="Einstellungen">⚙️</button></nav>
  <section id="view"></section>
</main>
<div class="veil" id="veil"></div>
<section class="sheet" id="sheet"></section>
<button class="go hidden" id="go"></button>

/* ---------- the main button: Telegram's own one inside Telegram, ours in a browser ---------- */
let goAction = null;
function setGo(text, action, enabled = true) {
  goAction = action;
  if (inTelegram) {
    tg.MainButton.setParams({ text, is_active: enabled, is_visible: true, has_shine_effect: enabled });
    return;
  }
  go.textContent = text; go.disabled = !enabled; go.classList.remove("hidden");
}
function hideGo() { goAction = null; if (inTelegram) tg.MainButton.hide(); else go.classList.add("hidden"); }
go.addEventListener("click", () => goAction && goAction());
if (inTelegram) tg.MainButton.onClick(() => goAction && goAction());

let backAction = null;
function setBack(action) {
  backAction = action;
  if (!inTelegram) return;
  if (action) tg.BackButton.show(); else tg.BackButton.hide();
}
if (inTelegram) tg.BackButton.onClick(() => backAction && backAction());

function show(html, after) {
  const old = view.firstElementChild;
  const draw = () => { view.innerHTML = html; view.querySelectorAll(".dev").forEach((el, i) => el.style.setProperty("--i", i)); after && after(); window.scrollTo({ top: 0 }); };
  if (old) { old.classList.add("leave"); setTimeout(draw, 220); } else draw();
}

function send(data, label) {
  const text = JSON.stringify(data);
  if (inTelegram) {
    buzz("medium");
    try { tg.sendData(text); return; } catch (e) { /* opened another way: show the data */ }
  }
  hideGo(); setBack(null);
  show(`<div class="sent"><div class="iris dev"></div><h2 class="dev">${esc(label)}</h2>
    <p class="note dev">Diese Seite gehört zum Bildstudio-Bot in Telegram – dort öffnen, dann geht es direkt los.</p>
    <div class="outside dev">Gesendet würde:<code>${esc(text)}</code></div></div>`);
}

  const nav = $("#tabs");
  nav.classList.remove("hidden");
  nav.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.tab === active));
  const on = nav.querySelector(`[data-tab="${active}"]`), pill = nav.querySelector(".pill");
  if (on) { pill.style.width = on.offsetWidth + "px"; pill.style.transform = `translateX(${on.offsetLeft}px)`; }
}

/* ---------- favourites: in Telegram's cloud storage (per user), else in the browser ---------- */
let favs = new Set();
function loadFavs(done) {
  const parse = (v) => { try { favs = new Set(JSON.parse(v || "[]")); } catch (e) { favs = new Set(); } done(); };
  if (inTelegram && tg.CloudStorage) tg.CloudStorage.getItem("favs", (err, v) => parse(err ? "[]" : v));
  else { let v = "[]"; try { v = localStorage.getItem("bs.favs") || "[]"; } catch (e) { /* private */ } parse(v); }
}
function saveFavs() {
  const v = JSON.stringify([...favs]);
  if (inTelegram && tg.CloudStorage) tg.CloudStorage.setItem("favs", v); else { try { localStorage.setItem("bs.favs", v); } catch (e) { /* private */ } }
}

/* ================= effects: pick one by its picture ================= */
let cat = "trend", query = "";
function pool() {
  const all = MENU.effects;
  if (query.trim()) {
    const q = query.trim().toLowerCase();
    return all.filter((f) => (f.n + " " + f.c + " " + (f.g || []).join(" ")).toLowerCase().includes(q));
  }
  if (cat === "trend") return all.filter((f) => f.t);
  if (cat === "fav") return all.filter((f) => favs.has(f.id));
  return all.filter((f) => f.c === cat);
}
function effects() {
  setBack(null); hideGo();
  if (!MENU || !MENU.effects.length) { show(`<p class="empty dev">Die Effekte werden gerade eingerichtet – gleich noch einmal öffnen.</p>`); return; }
  const cats = [{ id: "trend", e: "🔥", n: "Trend" }, { id: "fav", e: "♥", n: "Favoriten" }, ...MENU.categories];
  if (!cats.some((c) => c.id === cat)) cat = "trend";
  show(`<div>
    <div class="search dev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Effekt suchen …" value="${esc(query)}" autocomplete="off"></div>
    <div class="cats dev" id="cats">${cats.map((c) => `<button data-c="${esc(c.id)}" class="${cat === c.id ? "on" : ""}">${c.e} ${esc(c.n)}</button>`).join("")}</div>
    <div class="grid" id="grid"></div></div>`, () => {
    $("#q").addEventListener("input", (e) => { query = e.target.value; fill(); });
    $("#cats").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      cat = b.dataset.c; query = ""; $("#q").value = ""; buzz();
      $("#cats").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
      fill();
    });
    fill();
  });
}
function fill() {
  const list = pool(), grid = $("#grid");
  if (!grid) return;
  grid.innerHTML = list.length ? list.map((f, i) => `<button class="card" data-id="${esc(f.id)}" style="--i:${i % 10}">
      <div class="ph">${f.v ? `<img loading="lazy" decoding="async" src="${esc(f.v)}" alt="">` : `<span class="emo">${f.e}</span>`}</div>
      <div class="cap"><b>${f.e} ${esc(f.n)}</b>${f.i[0] > 1 ? `<small>${f.i[0]}${f.i[1] > f.i[0] ? "–" + f.i[1] : ""} Fotos</small>` : ""}</div>
      ${favs.has(f.id) ? `<i class="heart">♥</i>` : ""}</button>`).join("")
    : `<p class="empty">${cat === "fav" && !query ? "Noch keine Favoriten – im Effekt auf ♡ tippen." : "Nichts gefunden."}</p>`;
  grid.querySelectorAll("img").forEach((img) => { const done = () => img.classList.add("in"); if (img.complete) done(); else img.addEventListener("load", done); });
  grid.querySelectorAll(".card").forEach((c) => c.addEventListener("click", () => { buzz(); sheet(MENU.effects.find((f) => f.id === c.dataset.id)); }));
}

let quality = "normal";
function sheet(f) {
  const el = $("#sheet");
  const photos = f.i[0] === f.i[1] ? `${f.i[0]} ${f.i[0] === 1 ? "Foto" : "Fotos"}` : `${f.i[0]}–${f.i[1]} Fotos`;
  const catName = (MENU.categories.find((c) => c.id === f.c) || { n: "" }).n;

  });
  $("#ql").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    quality = b.dataset.q; buzz(); $("#ql").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
  });
  setBack(() => closeSheet());
  setGo(f.i[0] > 1 ? `📸 Auswählen · ${f.i[0]} Fotos schicken` : "📸 Auswählen · Foto schicken", () => {
    const p = {};
    el.querySelectorAll(".param").forEach((i) => { if (i.value.trim()) p[i.dataset.k] = i.value.trim(); });
    send({ t: "filter", id: f.id, q: quality, p }, `${f.e} ${f.n} – gewählt. Schick jetzt im Chat ${photos === "1 Foto" ? "dein Foto" : "deine Fotos"}.`);
  });
}
function closeSheet(silent) {
  $("#sheet").classList.remove("open"); $("#veil").classList.remove("open"); document.body.classList.remove("sheet-open");
  if (!silent) { setBack(null); hideGo(); }

function linkSettings() {
  const m = location.hash.match(/[#&]s=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  try {
    const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/") + "===".slice((m[1].length + 3) % 4);
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0))));
  } catch (e) { return null; }
}
const PREFS = Object.assign({ ql: "normal", f: "1:1", m: "", d: "einzeln", file: false, quick: false, n: 1, max: 20, limit: null }, linkSettings() || {});
quality = PREFS.ql || quality;
made.f = PREFS.f || made.f;
function settings() {
  setBack(null);
  const s = Object.assign({}, PREFS);
  const models = (MENU && MENU.models) || [];
  const fmts = (MENU && MENU.formats) || [];
  const quals = (MENU && MENU.qualities) || [{ id: "normal", n: "Normal" }];
  const maxN = (MENU && MENU.variants) || 4;
  const ratio = (w, h) => { const k = 26 / Math.max(w, h); return `width:${Math.round(w * k)}px;height:${Math.round(h * k)}px`; };
  const radio = (key, items) => `<div class="choice" data-key="${key}">${items.map((it) => `<button data-v="${esc(it.v)}" class="${String(s[key]) === String(it.v) ? "on" : ""}"><span class="dot"></span><span><b>${esc(it.b)}</b>${it.s ? `<small>${esc(it.s)}</small>` : ""}</span></button>`).join("")}</div>`;
  show(`<div>
    <h1 class="dev">Deine <em>Einstellungen</em></h1>
    <p class="lead dev">Gelten für dich im Bildstudio-Bot – gespeichert wird beim PC.</p>

    <div class="group dev"><div class="label">Ergebnisse</div><div class="rows">
      <div class="srow"><div class="head"><div class="txt"><b>Mehrere Bilder</b><small>Varianten, Ideen, Roulette</small></div></div>
        ${radio("d", [{ v: "einzeln", b: "Einzeln, sobald fertig", s: "Jedes Bild kommt sofort – du musst nicht warten" },
                      { v: "gesammelt", b: "Alle zusammen am Ende", s: "Ein Album, wenn das letzte fertig ist" }])}</div>
      <div class="srow"><div class="head"><div class="txt"><b>Als Datei senden</b><small>Volle Qualität statt komprimiertem Telegram-Foto</small></div>
        <input type="checkbox" class="switch" data-key="file" ${s.file ? "checked" : ""}></div></div>
    </div></div>

    <div class="group dev"><div class="label">Standard für neue Bilder</div><div class="rows">
      ${models.length ? `<div class="srow"><div class="head"><div class="txt"><b>Bildmodell</b></div></div>
        ${radio("m", models.map((x, i) => ({ v: i === 0 && !s.m ? "" : x.id, b: x.n + (i === 0 ? " · Standard" : ""), s: x.h })))}</div>` : ""}
      <div class="srow"><div class="head"><div class="txt"><b>Qualität</b></div></div>
        <div class="seg" data-key="ql">${quals.map((q) => `<button data-v="${esc(q.id)}" class="${s.ql === q.id ? "on" : ""}">${esc(q.n)}</button>`).join("")}</div></div>
      ${fmts.length ? `<div class="srow"><div class="head"><div class="txt"><b>Format</b></div></div>
        <div class="formats" data-key="f">${fmts.map((f) => `<button class="fmt ${s.f === f.id ? "on" : ""}" data-v="${esc(f.id)}"><span class="shape" style="${ratio(f.w, f.h)}"></span><b>${esc(f.id)}</b><small>${esc(f.n)}</small></button>`).join("")}</div></div>` : ""}
    </div></div>

    <div class="group dev"><div class="label">Text im Chat</div><div class="rows">
      <div class="srow"><div class="head"><div class="txt"><b>Sofort erstellen</b><small>Ohne Auswahl von Anzahl und Stil vorher</small></div>
        <input type="checkbox" class="switch" data-key="quick" ${s.quick ? "checked" : ""}></div>
        <div class="fold ${s.quick ? "" : "shut"}" id="fold"><div class="seg" data-key="n">${Array.from({ length: maxN }, (_, i) => i + 1).map((n) => `<button data-v="${n}" class="${+s.n === n ? "on" : ""}">${n} ${n === 1 ? "Bild" : "Bilder"}</button>`).join("")}</div></div></div>
    </div></div>

    <div class="group dev"><div class="label">Dein Konto</div><div class="rows"><div class="account">
      <div><b>${esc(s.max)}</b><small>Bilder pro Idee</small></div>
      <div><b>${s.limit ? esc(s.limit) : "∞"}</b><small>Aufträge pro Tag</small></div>
    </div></div></div></div>`, () => {
    // the model row: the first (standard) model stands for "" (no own choice)
    const first = models[0] && models[0].id;
    view.querySelectorAll("[data-key]").forEach((box) => {
      const key = box.dataset.key;
      if (box.classList.contains("switch")) {
        box.addEventListener("change", () => {
          s[key] = box.checked; buzz("medium");
          if (key === "quick") $("#fold").classList.toggle("shut", !box.checked);
        });
        return;
      }
      box.addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        let v = b.dataset.v;
        if (key === "n") v = +v;
        if (key === "m" && v === first) v = "";
        s[key] = v; buzz();
        box.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
      });
    });
    setGo("Einstellungen speichern", () => {
      try { if (inTelegram && tg.CloudStorage) tg.CloudStorage.setItem("prefs", JSON.stringify(s)); } catch (e) { /* not stored */ }
      send({ t: "settings", ql: s.ql, f: s.f, m: s.m, d: s.d, file: !!s.file, quick: !!s.quick, n: +s.n || 1 }, "Einstellungen gespeichert");
    });
  });
}

/* ================= idea: tell me your idea ================= */
function home() {
  setBack(null);
  show(`<div>
    <h1 class="dev">Was möchtest du <em>sehen</em>?</h1>
    <p class="lead dev">Erzähl mir deine Idee in ein paar Worten. Im Chat frage ich nach, was noch offen ist – dann kommen so viele Bilder, wie du willst.</p>
    <div class="canvas dev"><div class="canvas-in">
      <textarea id="idea" maxlength="2000" placeholder="z. B. Ein Leuchtturm im Sturm bei Nacht …"></textarea>
      <div class="counter"><span id="len">0</span>/2000</div>
    </div></div>
    <div class="examples dev">${EXAMPLES.map((e) => `<button data-ex="${esc(e)}">${esc(e)}</button>`).join("")}</div>
    <div class="steps">
      <div class="step dev"><i>1</i><div><b>Deine Idee</b><span>Ein Satz reicht – Motiv, Anlass, Gefühl.</span></div></div>
      <div class="step dev"><i>2</i><div><b>Ein paar Fragen im Chat</b><span>Stil, Look, Licht – einfach Knöpfe antippen.</span></div></div>
      <div class="step dev"><i>3</i><div><b>Format & Anzahl</b><span>Hochkant, Breitbild, bis zu 20 Bilder auf einmal.</span></div></div>
      <div class="step dev"><i>4</i><div><b>Deine Bilder</b><span>Kommen im Chat an – so, wie du es unter ⚙️ eingestellt hast.</span></div></div>
    </div></div>`, () => {
    const box = $("#idea"), len = $("#len");
    const update = () => { len.textContent = box.value.length; setGo("Idee senden ✨", () => send({ t: "idea", idea: box.value.trim() }, "Idee unterwegs …"), box.value.trim().length >= 3); };
    box.addEventListener("input", update);
    view.querySelectorAll("[data-ex]").forEach((b) => b.addEventListener("click", () => { box.value = b.dataset.ex; buzz(); update(); box.focus(); }));
    update();
  });
}

loadFavs(() => openTab(location.hash.includes("idee") ? "idea" : "effects"));
