<title>PikTscha</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cdefs%3E%3ClinearGradient id=%22fr%22 x1=%2230%22 y1=%2222%22 x2=%2276%22 y2=%2268%22 gradientUnits=%22userSpaceOnUse%22%3E%3Cstop offset=%220%22 stop-color=%22%23ff2d55%22/%3E%3Cstop offset=%22.5%22 stop-color=%22%23a24bff%22/%3E%3Cstop offset=%221%22 stop-color=%22%2318e4d6%22/%3E%3C/linearGradient%3E%3ClinearGradient id=%22ft%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%22100%22 gradientUnits=%22userSpaceOnUse%22%3E%3Cstop offset=%220%22 stop-color=%22%231b1c23%22/%3E%3Cstop offset=%221%22 stop-color=%22%230c0d11%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%22100%22 height=%22100%22 rx=%2226%22 fill=%22url%28%23ft%29%22/%3E%3Ccircle cx=%2253%22 cy=%2244%22 r=%2215.5%22 fill=%22none%22 stroke=%22url%28%23fr%29%22 stroke-width=%2213%22/%3E%3Crect x=%2226%22 y=%2224%22 width=%2214%22 height=%2254%22 rx=%227%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2253%22 cy=%2244%22 r=%223.8%22 fill=%22%23fff%22/%3E%3Cpath d=%22M80 11c1 5.4 3.1 7.5 8.5 8.5-5.4 1-7.5 3.1-8.5 8.5-1-5.4-3.1-7.5-8.5-8.5 5.4-1 7.5-3.1 8.5-8.5z%22 fill=%22%2318e4d6%22/%3E%3C/svg%3E">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* PikTscha – in CutForge's design language (the user's wish): a near-black stage with two drifting colour fields, the
   chromatic split (a red and a turquoise ghost a pixel beside the shape), a floating tab bar at the bottom, effect
   tiles with their preview, sheets that spring up as a card, pills, a red-to-turquoise main action. */
:root {
  --bg: #08090b; --bg2: rgba(255,255,255,.045); --bg3: rgba(255,255,255,.085); --solid2: #121418; --text: #f4f4f2; --hint: #8a8f98;
  --line: rgba(255,255,255,.085); --nav: rgba(18,20,24,.84);
  --red: #ff2d55; --cyan: #18e4d6; --violet: #b23ad8; --red-a: rgba(255,45,85,.28); --cyan-a: rgba(24,228,214,.16); --cyan-line: rgba(24,228,214,.38);
  --aur-r: rgba(255,45,85,.20); --aur-c: rgba(24,228,214,.15); --tint-r: rgba(255,45,85,.075); --tint-c: rgba(24,228,214,.06);
  --split: -1.5px 0 0 var(--red), 1.5px 0 0 var(--cyan); --split-sm: -1px 0 0 var(--red), 1px 0 0 var(--cyan);
  --glow: 0 0 22px rgba(255,45,85,.18), 0 0 22px rgba(24,228,214,.14);
  --brand: linear-gradient(110deg, var(--red), var(--violet) 50%, var(--cyan));
  --radius: 18px; --spring: cubic-bezier(.16, 1, .3, 1); --ease: cubic-bezier(.2, .8, .2, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
}
:root[data-theme="light"] { --bg: #f5f5f2; --bg2: rgba(0,0,0,.035); --bg3: rgba(0,0,0,.065); --solid2: #ffffff; --text: #111214; --hint: #6a6f78;
  --line: rgba(0,0,0,.08); --nav: rgba(255,255,255,.86); --red: #e8164a; --cyan: #06a196; --red-a: rgba(232,22,74,.16); --cyan-a: rgba(6,161,150,.12);
  --cyan-line: rgba(6,161,150,.4); --aur-r: rgba(232,22,74,.10); --aur-c: rgba(6,161,150,.10); --tint-r: rgba(232,22,74,.05); --tint-c: rgba(6,161,150,.05);
  color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; overscroll-behavior: none; background: var(--bg); }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.42 var(--font); -webkit-font-smoothing: antialiased; }
body { padding-bottom: calc(92px + env(safe-area-inset-bottom)); overflow-x: hidden; }
body.dock-on { padding-bottom: calc(160px + env(safe-area-inset-bottom)); }
body.lock { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
input, textarea { font-size: 16px; }
::placeholder { color: var(--hint); }
svg { display: block; }
.hidden { display: none !important; }

/* ---------- living background: two soft colour fields drifting (red / turquoise) ---------- */
.aurora { position: fixed; left: 0; right: 0; top: 0; height: 80vh; pointer-events: none; z-index: 0; overflow: hidden; }
.aurora i { position: absolute; width: 95vw; height: 95vw; max-width: 640px; max-height: 640px; border-radius: 50%; will-change: transform; }
.aurora i:first-child { background: radial-gradient(closest-side, var(--aur-r), transparent); left: -22vw; top: -30vw; animation: drift1 19s ease-in-out infinite alternate; }
.aurora i:last-child { background: radial-gradient(closest-side, var(--aur-c), transparent); right: -28vw; top: -8vw; animation: drift2 23s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(26vw, 10vh) scale(1.18); } }
@keyframes drift2 { to { transform: translate(-24vw, 6vh) scale(.88); } }
.app { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top, 0px)) 16px 8px;
  transform-origin: 50% 0; transition: transform .55s var(--spring), opacity .45s var(--ease); }
body.lock .app { transform: scale(.94); opacity: .4; }

/* ---------- header: logo, the wordmark in RGB split with a short glitch now and then ---------- */
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; animation: down .8s var(--spring) backwards; }
.logo { width: 28px; height: 28px; flex: none; border-radius: 8px; box-shadow: var(--split-sm); }
.brand { position: relative; font-weight: 800; letter-spacing: -.01em; font-size: 22px; text-shadow: var(--split); }
.brand::before, .brand::after { content: attr(data-text); position: absolute; inset: 0; pointer-events: none; opacity: 0; text-shadow: none; }
.brand::before { color: var(--red); animation: glitch1 8s infinite steps(1); }
.brand::after { color: var(--cyan); animation: glitch2 8s infinite steps(1); }
@keyframes glitch1 { 0%, 92%, 100% { opacity: 0; transform: none; clip-path: none; }
  93% { opacity: .9; transform: translate(-3px, -1px); clip-path: inset(10% 0 55% 0); }
  94.5% { opacity: .9; transform: translate(2px, 1px); clip-path: inset(60% 0 8% 0); }
  96% { opacity: .8; transform: translate(-2px, 0); clip-path: inset(30% 0 40% 0); } }
@keyframes glitch2 { 0%, 92%, 100% { opacity: 0; transform: none; clip-path: none; }
  93.5% { opacity: .9; transform: translate(3px, 1px); clip-path: inset(50% 0 20% 0); }
  95% { opacity: .9; transform: translate(-2px, -1px); clip-path: inset(5% 0 70% 0); }
  96.5% { opacity: .8; transform: translate(2px, 0); clip-path: inset(70% 0 5% 0); } }
.ver { color: var(--hint); font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46%; font-variant-numeric: tabular-nums; }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--hint); opacity: .5; margin-left: auto; flex: none; }
.live.box { background: linear-gradient(90deg, var(--red), var(--cyan)); width: 9px; height: 9px; opacity: 1; animation: beat 2.6s infinite; }
@keyframes beat { 0% { box-shadow: 0 0 0 0 var(--cyan-line); } 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

/* ---------- titles, labels, text ---------- */
h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1.12; margin: 2px 2px 6px; text-shadow: var(--split-sm); }
h1 em, h2 em { font-style: normal; text-shadow: none; background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.18; margin: 4px 2px 6px; text-shadow: var(--split-sm); }
.sec { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--hint); margin: 22px 2px 12px;
  display: flex; align-items: center; gap: 9px; }
.sec::before { content: ""; width: 14px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--red), var(--cyan)); }
.lead { color: var(--hint); margin: 4px 2px 14px; }
.label { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--hint); margin: 20px 2px 9px; }
.note { color: var(--hint); font-size: 12.5px; margin: 8px 2px 0; }

/* ---------- inputs: the split shows on focus ---------- */
.field { position: relative; }
.field textarea, .field input { width: 100%; border: 1px solid var(--line); background: var(--bg2); border-radius: 14px; padding: 13px 15px; outline: none;
  transition: border-color .25s, box-shadow .3s; }
.field textarea { min-height: 110px; resize: none; line-height: 1.42; padding-bottom: 28px; }
.field textarea:focus, .field input:focus { border-color: transparent; box-shadow: var(--split), var(--glow); }
.field .count { position: absolute; right: 13px; bottom: 9px; font-size: 12px; color: var(--hint); font-variant-numeric: tabular-nums; }
.search { position: relative; margin-bottom: 8px; }
.search input { width: 100%; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg2); padding: 0 40px; outline: none;
  transition: border-color .25s, box-shadow .3s; }
.search input:focus { border-color: transparent; box-shadow: var(--split), var(--glow); }
.search > svg { position: absolute; left: 13px; top: 13px; width: 18px; height: 18px; color: var(--hint); transition: color .3s, transform .45s var(--spring); }
.search:focus-within > svg { color: var(--text); transform: scale(1.1) rotate(-8deg); }
.search .clear { position: absolute; right: 6px; top: 6px; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--hint); }
.search .clear svg { width: 15px; height: 15px; }

/* ---------- pills ---------- */
.scroller { display: flex; gap: 7px; overflow-x: auto; margin: 10px -16px 0; padding: 2px 16px 4px; scrollbar-width: none; scroll-padding-inline: 16px; }
.scroller::-webkit-scrollbar { display: none; }
.chip, .seg button { position: relative; flex: none; border: 1px solid var(--line); background: var(--bg2); border-radius: 999px; padding: 9px 15px; font-size: 14px;
  white-space: nowrap; transition: background .35s var(--ease), color .35s, border-color .35s, box-shadow .35s, transform .4s var(--spring); }
.chip:active, .seg button:active { transform: scale(.92); }
.chip.on, .seg button.on { background: var(--text); color: var(--bg); border-color: transparent; box-shadow: var(--split), var(--glow); font-weight: 600; }
.seg { display: flex; flex-wrap: wrap; gap: 7px; }

/* ---------- formats, option rows ---------- */
.formats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; }
.fmt { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; padding: 12px 2px 9px;
  border-radius: 14px; border: 1px solid var(--line); background: var(--bg2); transition: transform .4s var(--spring), border-color .3s, box-shadow .3s; }
.fmt:active { transform: scale(.92); }
.fmt .shape { border: 1.6px solid var(--hint); border-radius: 4px; transition: border-color .3s, background .3s; }
.fmt b { font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
.fmt small { font-size: 10.5px; color: var(--hint); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fmt.on { border-color: transparent; box-shadow: var(--split), var(--glow); }
.fmt.on .shape { border-color: var(--text); background: linear-gradient(135deg, var(--red-a), var(--cyan-a)); }
.tip { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); padding: 1px 7px; border-radius: 999px; background: var(--brand);
  color: #fff; font-size: 10px; font-weight: 700; white-space: nowrap; }
.list { display: grid; gap: 9px; }
.list.two { grid-template-columns: 1fr 1fr; }
.opt { position: relative; overflow: hidden; isolation: isolate; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; text-align: left;
  padding: 13px 14px; border-radius: var(--radius); border: 1px solid var(--line);
  background: radial-gradient(90% 160% at 0 50%, var(--tint, transparent), transparent 60%), var(--bg2);
  transition: transform .4s var(--spring), border-color .3s, box-shadow .3s; }
.list .opt:nth-child(odd) { --tint: var(--tint-r); }
.list .opt:nth-child(even) { --tint: var(--tint-c); }
.opt:active { transform: scale(.965); }
.opt.on { border-color: transparent; box-shadow: var(--split), var(--glow); }
.opt .txt { flex: 1; min-width: 0; }
.opt b { display: block; font-weight: 650; font-size: 15px; line-height: 1.3; }
.opt small { display: block; color: var(--hint); font-size: 12.5px; margin-top: 2px; line-height: 1.35; }
.opt .badge { flex: none; padding: 2px 8px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 11px; font-weight: 700; }
.check { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--bg3); transition: background .35s; }
.check svg { width: 12px; height: 12px; color: #fff; opacity: 0; transform: scale(.6); transition: opacity .3s, transform .5s var(--spring); }
.opt.on .check { background: linear-gradient(135deg, var(--red), var(--cyan)); }
.opt.on .check svg { opacity: 1; transform: none; }

/* ---------- effects: tiles with their preview ---------- */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { position: relative; overflow: hidden; isolation: isolate; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; text-align: left;
  aspect-ratio: 3 / 4; padding: 0 0 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--solid2);
  transition: transform .4s var(--spring), border-color .3s, box-shadow .3s; }
.tile .pv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; opacity: 0;
  transition: transform .6s var(--spring), opacity .5s var(--ease); }
.tile .pv.in { opacity: 1; }
.tile .emo { position: absolute; inset: 0; display: grid; place-items: center; font-size: 44px; z-index: -2;
  background: radial-gradient(130% 90% at 0 0, var(--tint-r), transparent 62%), radial-gradient(130% 90% at 100% 100%, var(--tint-c), transparent 62%), var(--bg2); }
.tile::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, transparent 38%, rgba(0,0,0,.35) 62%, rgba(0,0,0,.82)); }
.tile .t, .tile .d { padding: 0 13px; color: #fff; }
.tile .t { font-weight: 650; font-size: 15.5px; letter-spacing: -.01em; line-height: 1.2;
  text-shadow: -1px 0 0 var(--red-a), 1px 0 0 var(--cyan-a), 0 1px 8px rgba(0,0,0,.6); }
.tile .d { color: rgba(255,255,255,.78); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
.tile:active { transform: scale(.965); }
.tile:active .pv { transform: scale(1.06); }
.tile .heart { position: absolute; top: 9px; right: 9px; color: var(--red); filter: drop-shadow(0 0 6px rgba(0,0,0,.6)); font-size: 14px; }
@media (hover: hover) and (pointer: fine) {
  .tile:hover { border-color: var(--cyan-line); box-shadow: var(--glow); transform: translateY(-2px); }
  .tile:hover .pv { transform: scale(1.05); }
  .opt:hover:not(.on), .fmt:hover:not(.on) { border-color: var(--cyan-line); }
}
.empty { grid-column: 1 / -1; color: var(--hint); text-align: center; padding: 48px 0; animation: rise .5s var(--spring) backwards; }

/* ---------- tab bar at the bottom with a gliding indicator ---------- */
.tabs { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); max-width: 620px; margin: 0 auto; height: 62px;
  background: var(--nav); -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4); border: 1px solid var(--line);
  border-radius: 22px; display: flex; z-index: 5; box-shadow: 0 10px 40px rgba(0,0,0,.3);
  animation: up .8s .12s var(--spring) backwards; transition: transform .5s var(--spring), opacity .35s; }
body.lock .tabs, body.dock-on .tabs.hide-for-go { transform: translateY(150%); opacity: 0; }
.tabs .pill { position: absolute; top: 6px; bottom: 6px; left: 0; width: 0; border-radius: 16px; background: var(--bg3); pointer-events: none;
  transition: transform .55s var(--spring), width .55s var(--spring); }
.tabs .pill::after { content: ""; position: absolute; left: 32%; right: 32%; bottom: 4px; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, var(--red), var(--cyan)); box-shadow: 0 0 10px var(--cyan-a); }
.tabs button { position: relative; z-index: 1; flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; font-size: 10.5px; color: var(--hint); transition: color .35s; }
.tabs button svg { width: 21px; height: 21px; transition: transform .55s var(--spring), filter .35s; }
.tabs button.on { color: var(--text); }
.tabs button.on svg { transform: translateY(-2px) scale(1.08); filter: drop-shadow(-1px 0 var(--red)) drop-shadow(1px 0 var(--cyan)); }
.tabs button:active svg { transform: scale(.82); }

/* ---------- orders on their way: chips under the header ---------- */
.trips { display: flex; gap: 9px; overflow-x: auto; margin: -4px -16px 10px; padding: 2px 16px 8px; scrollbar-width: none; }
.trips:empty { display: none; }
.trips::-webkit-scrollbar { display: none; }
.trip { position: relative; overflow: hidden; isolation: isolate; flex: none; display: flex; align-items: center; gap: 9px; max-width: 270px;
  padding: 7px 8px 7px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--bg2); animation: rise .55s var(--spring) backwards; }
.trip .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--hint); }
.trip.live .dot { background: var(--cyan); animation: beat 2.2s infinite; }
.trip.ok { border-color: var(--cyan-line); }
.trip.ok .dot { background: var(--cyan); }
.trip.ok .tx span { color: var(--cyan); }
.trip.bad { border-color: var(--red-a); }
.trip.bad .dot { background: var(--red); }
.trip.bad .tx span { color: var(--red); }
.trip .tx { min-width: 0; }
.trip .tx b { display: block; font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trip .tx span { display: block; font-size: 11.5px; color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.trip .act { flex: none; height: 28px; padding: 0 11px; border-radius: 999px; background: var(--bg3); font-size: 12.5px; font-weight: 650;
  transition: transform .4s var(--spring); }
.trip .act:active { transform: scale(.88); }
.trip .act.stop { color: var(--red); }
.trip .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: calc(var(--p, 0) * 100%); background: linear-gradient(90deg, var(--red), var(--cyan));
  transition: width .6s var(--ease); }

/* ---------- the sheet: springs up as a card, the page behind steps back ---------- */
.scrim { position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .5s var(--ease); }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; top: calc(10px + env(safe-area-inset-top, 0px)); bottom: 0; z-index: 10; max-width: 640px; margin: 0 auto;
  display: flex; flex-direction: column; transform: translateY(105%); background: var(--bg); border-radius: 24px 24px 0 0;
  box-shadow: 0 -1px 0 var(--line), 0 -20px 60px rgba(0,0,0,.35); transition: transform .6s var(--spring); }
.sheet.open { transform: translateY(0); }
.sheet.dragging, .scrim.dragging { transition: none; }
.grab { flex: none; height: 22px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.grab i { width: 42px; height: 5px; border-radius: 3px; background: var(--bg3); }
.sheet .x { position: absolute; z-index: 4; top: 26px; right: 16px; width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center;
  background: var(--bg3); transition: transform .45s var(--spring); }
.sheet .x:active { transform: rotate(90deg) scale(.88); }
.sheet .x svg { width: 15px; height: 15px; }
.sheet-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px calc(110px + env(safe-area-inset-bottom)); }
.sheet-head { display: flex; align-items: center; gap: 10px; margin: 0 52px 2px 2px; touch-action: none; }
.sheet-head h2 { flex: 1; margin: 0; font-size: 26px; }
.fav { flex: none; width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; color: var(--hint); background: var(--bg3);
  transition: color .3s, transform .45s var(--spring); }
.fav svg { width: 17px; height: 17px; }
.fav.on { color: var(--red); filter: drop-shadow(0 0 8px var(--red-a)); animation: star .7s var(--spring); }
@keyframes star { 0% { transform: scale(.5) rotate(-40deg); } 55% { transform: scale(1.3) rotate(8deg); } 100% { transform: none; } }
.sheet-pv { display: flex; justify-content: center; margin: 12px 0 4px; touch-action: none; }
.sheet-pv .pv { height: 250px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 20px; background: var(--solid2); -webkit-user-drag: none;
  box-shadow: -2px 0 0 var(--red-a), 2px 0 0 var(--cyan-a), var(--glow); animation: rise .7s var(--spring) backwards; }

/* ---------- 📮 photos into the Briefkasten ---------- */
const b64 = (buf) => { let s = ""; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode(...a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function seal(key, data, aad) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: new TextEncoder().encode(aad) }, key, data));
  const out = new Uint8Array(12 + ct.length);
  out.set(iv); out.set(ct, 12);
  return out;
}
async function boxCall(method, path, { body, token, raw } = {}) {
  const headers = token ? { "X-Up-Token": token } : { "X-Ticket": TICKET };
  if (body !== undefined) headers["Content-Type"] = raw ? "application/octet-stream" : "application/json";
  let r;
  try {
    r = await fetch(BOX.url.replace(/\/+$/, "") + path, { method, headers, body: body === undefined ? undefined : raw ? body : JSON.stringify(body) });
  } catch (e) { const err = new Error("Keine Verbindung – Internet da?"); err.status = 0; throw err; }
  let data = null;
  try { data = await r.json(); } catch (e) { /* no JSON */ }
  if (!r.ok) { const err = new Error((data && data.error) || `Hochladen ging nicht (${r.status})`); err.status = r.status; throw err; }
  return data;
}
/* A phone photo, upright and at most 4096 px – smaller uploads, nothing the models would use is lost. */
async function shrink(file) {
  const png = file.type === "image/png";
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 4096 / Math.max(bmp.width, bmp.height));
    if (png && scale === 1) { if (bmp.close) bmp.close(); return { blob: file, name: file.name || "foto.png" }; }
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    const blob = await new Promise((ok) => c.toBlob(ok, png ? "image/png" : "image/jpeg", 0.93));
    if (!blob) throw new Error("no blob");
    return { blob, name: (file.name || "foto").replace(/\.[^.]+$/, "") + (png ? ".png" : ".jpg") };
  } catch (e) { return { blob: file, name: file.name || "foto" }; }   // let the PC try (e.g. HEIC)
}
async function boxUpload(order, files, progress) {
  const pub = await crypto.subtle.importKey("spki", unb64(BOX.key), { name: "RSA-OAEP", hash: "SHA-256" }, false, ["encrypt"]);
  const key = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt"]);
  const wk = await crypto.subtle.encrypt({ name: "RSA-OAEP" }, pub, await crypto.subtle.exportKey("raw", key));
  let n = 0;
  const list = files.map((f) => { const count = Math.max(1, Math.ceil(f.blob.size / PART)); const e = { name: f.name, size: f.blob.size, first: n, count }; n += count; return e; });
  const total = files.reduce((a, f) => a + f.blob.size, 0);
  const man = await seal(key, new TextEncoder().encode(JSON.stringify({ v: 2, order, files: list })), "man");
  const up = await boxCall("POST", "/up", { body: { wk: b64(wk), man: b64(man), parts: n, size: total } });
  const jobs = [];
  list.forEach((e, i) => { for (let j = 0; j < e.count; j++) jobs.push({ blob: files[i].blob, size: e.size, j, n: e.first + j }); });
  let sent = 0, next = 0;
  const one = async (job) => {
    const piece = job.blob.slice(job.j * PART, Math.min(job.size, (job.j + 1) * PART));
    const body = await seal(key, await piece.arrayBuffer(), `part:${job.n}`);
    for (let a = 0; ; a++) {
      try { await boxCall("PUT", `/up/${up.id}/${job.n}`, { body, token: up.token, raw: true }); break; } catch (e) {
        if (a >= 3 || (e.status >= 400 && e.status < 500 && e.status !== 429)) throw e;
        await new Promise((ok) => setTimeout(ok, 900 * (a + 1)));
      }
    }
    sent += piece.size; progress(total ? sent / total : 1);
  };
  await Promise.all([0, 1, 2].map(async () => { while (next < jobs.length) await one(jobs[next++]); }));
  await boxCall("POST", `/up/${up.id}/done`, { token: up.token });
  return up;
}

(function dragToClose() {   // pull the picture or the handle down; a quick flick is enough
  let drag = null;
  sheet.addEventListener("pointerdown", (e) => {
    const zone = e.target.closest(".grab, .sheet-head, .sheet-pv");
    if (!zone || drag || !sheet.classList.contains("open")) return;
    drag = { id: e.pointerId, y: e.clientY, t: performance.now(), top: sheetScroll.scrollTop, dy: 0 };
    try { zone.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
    sheet.classList.add("dragging"); scrim.classList.add("dragging");
  });
  sheet.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dy = e.clientY - drag.y;
    if (dy < 0 || drag.top > 0) {   // upwards (or the content is scrolled): move the content instead
      sheetScroll.scrollTop = drag.top - dy; drag.dy = 0; sheet.style.transform = ""; scrim.style.opacity = "";
      return;
    }
    drag.dy = dy;
    sheet.style.transform = `translate3d(0, ${dy}px, 0)`;
    scrim.style.opacity = String(Math.max(0, 1 - dy / sheet.offsetHeight));
  });
  const end = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dy = drag.dy, velocity = dy / Math.max(1, performance.now() - drag.t);
    drag = null;
    sheet.classList.remove("dragging"); scrim.classList.remove("dragging");
    if (dy > sheet.offsetHeight * 0.25 || (dy > 12 && velocity > 0.11)) closeSheet();
    else { sheet.style.transform = ""; scrim.style.opacity = ""; }
  };
  sheet.addEventListener("pointerup", end);
  sheet.addEventListener("pointercancel", end);
})();

    <div class="field"><textarea id="idea" maxlength="2000" placeholder="z. B. Ein Leuchtturm im Sturm bei Nacht …">${esc(draft)}</textarea><span class="count"><span id="len">0</span>/2000</span></div>
    <div class="scroller" id="ex">${EXAMPLES.map((e) => `<button class="chip" data-ex="${esc(e)}">${esc(e)}</button>`).join("")}</div>
    ${BOX ? `<div class="label">Foto dazu <span class="aside">optional – z. B. „Mein Hund als Ritter“</span></div>
    <div class="picks" id="ishots"></div><input type="file" id="ishotfile" accept="image/*" multiple hidden>` : ""}
    ${BOX ? '<button class="ghost-btn" id="auto">⚡ Ohne Fragen – die KI entscheidet alles</button>' : ""}
    <div class="how">
      <div><i>1</i><p><b>Idee senden</b><span>Ein Satz reicht – Motiv, Anlass, Gefühl. Mit Foto bleibt erkennbar, was darauf ist.</span></p></div>
      <div><i>2</i><p><b>Fragen antippen</b><span>Meine Empfehlungen sind schon gewählt – ändern oder einfach weiter.</span></p></div>
      <div><i>3</i><p><b>Bilder bekommen</b><span>Bis zu ${esc(PREFS.max)} Stück, direkt in den Chat.</span></p></div>
    </div></div>`, () => {
    const box = $("#idea"), len = $("#len"), shots = $("#ishots"), file = $("#ishotfile");
    const go = (auto) => {
      const text = box.value.trim();
      if (text.length < 3) { toast("Erst die Idee in ein paar Worten"); return; }
      if (!BOX) { send({ t: "idea", idea: text }, "Deine Idee ist unterwegs"); return; }
      dispatch({ t: "idea", idea: text, auto }, { files: ideaShots.map((s) => s.file), title: (auto ? "⚡ " : "💡 ") + text });
      ideaShots.forEach((s) => URL.revokeObjectURL(s.url)); ideaShots = [];
      draft = "";
      if (auto) { toast("Geht los – den Stand siehst du oben"); ideaHome(); } else thinking();
    };
    const paint = () => {
      if (!shots) return;
      shots.innerHTML = ideaShots.map((s, i) => `<div class="pick"><img src="${s.url}" alt=""><i>${i + 1}</i>
          <button class="unpick" data-i="${i}" aria-label="Foto ${i + 1} entfernen">${ICON.x}</button></div>`).join("")
        + (ideaShots.length < 3 ? `<button class="pick add" id="addishot">${ICON.camera}<span>${ideaShots.length ? "Noch eins" : "Foto wählen"}</span></button>` : "");
    };
    const update = () => {
      draft = box.value; len.textContent = box.value.length;
      setGo(ideaShots.length ? "Idee mit Foto senden" : "Idee senden", () => go(false), box.value.trim().length >= 3);
    };
    box.addEventListener("input", update);
    $("#ex").addEventListener("click", (e) => {
      const b = e.target.closest("[data-ex]"); if (!b) return;
      box.value = b.dataset.ex; haptic.pick(); update();
    });
    if (shots) {
      shots.addEventListener("click", (e) => {
        const un = e.target.closest(".unpick");
        if (un) { const [gone] = ideaShots.splice(+un.dataset.i, 1); URL.revokeObjectURL(gone.url); haptic.pick(); paint(); update(); return; }
        if (e.target.closest("#addishot")) file.click();
      });
      file.addEventListener("change", () => {
        [...file.files].filter((x) => x.type.startsWith("image/") || !x.type).slice(0, 3 - ideaShots.length)
          .forEach((f) => ideaShots.push({ file: f, url: URL.createObjectURL(f) }));
        file.value = ""; haptic.tap(); paint(); update();
      });
    }
    if ($("#auto")) $("#auto").addEventListener("click", () => { haptic.tap("medium"); go(true); });
    if ($("#ai")) $("#ai").addEventListener("click", () => { haptic.tap(); openAi(); });
    paint(); update();
  });
}

/* ---------- 🧠 the language model behind the ideas (owner): choose, load, unload ---------- */
const gb = (n) => n ? `${(n / 1e9).toFixed(1)} GB` : "";
async function openAi() {
  sheetScroll.innerHTML = `<div class="sheet-head"><h2>KI-Modell</h2></div>
    <p class="lead">Das Sprachmodell in LM Studio, das die Fragen stellt und die Bildbeschreibungen schreibt.</p>
    <div id="aibody"><p class="empty">Frage den PC …</p></div>`;
  sheet.classList.add("open"); scrim.classList.add("open"); document.body.classList.add("lock");
  setBack(() => closeSheet()); hideGo();
  let st;
  const paintAi = () => {
    const loaded = st.loaded || [];
    const sel = st.pick || st.current;
    $("#aibody").innerHTML = !st.reachable ? '<p class="empty">LM Studio antwortet nicht – läuft es auf dem PC?</p>' : `
      <div class="info">${ICON.camera}<span>${loaded.length ? `Geladen: <b>${esc(loaded.join(", "))}</b>` : "Gerade ist kein Sprachmodell geladen – die Grafikkarte ist frei für Bilder."}
        Vor jedem Bild wird es wieder entladen; nach 15 min Leerlauf auch.</span></div>
      <div class="label">Modell für die Ideen</div>
      ${options("aim", st.models.map((m) => ({ v: m.id, b: m.name, tip: m.id === st.current,
        s: [m.params, gb(m.size), m.vision ? "sieht Fotos" : "ohne Bildverständnis", loaded.includes(m.id) ? "geladen" : ""].filter(Boolean).join(" · ") })), sel)}
      <div class="row2b"><button class="ghost-btn" id="aiload">${loaded.includes(sel) ? "✓ Geladen" : "Laden"}</button>
        <button class="ghost-btn danger" id="aiunload" ${loaded.length ? "" : "disabled"}>Entladen</button></div>
      <p class="note">„Tipp“ = das Modell, das gerade für die Ideen eingestellt ist. Laden belegt etwa so viel Grafikspeicher wie angegeben.</p>`;
    if (!st.reachable) return;
    pick($("#aim"), async (v) => {
      st.pick = v;
      if (v !== st.current) { try { st = await ask({ t: "llm", act: "select", id: v }); toast("Für die Ideen eingestellt"); } catch (e) { toast(e.message); } }
      paintAi();
    });
    $("#aiload").addEventListener("click", async (e) => {
      const b = e.currentTarget; b.disabled = true; b.textContent = "Lädt … (bis zu 1 min)";
      try { st = await ask({ t: "llm", act: "load", id: st.pick || st.current }); haptic.ok(); toast("Geladen"); } catch (err) { toast(err.message); }
      paintAi();
    });
    $("#aiunload").addEventListener("click", async (e) => {
      const b = e.currentTarget; b.disabled = true; b.textContent = "Entlädt …";
      try { st = await ask({ t: "llm", act: "unload" }); haptic.ok(); toast("Entladen – Grafikkarte frei"); } catch (err) { toast(err.message); }
      paintAi();
    });
  };
  try { st = await ask({ t: "llm" }); paintAi(); }
  catch (e) { $("#aibody").innerHTML = `<p class="empty">${esc(e.message || "Der PC antwortet nicht.")}</p>`; }
}

const iv = { step: 0, s: null };
function ivState() {
  if (!iv.s) {
    const p = IDEA, max = p.max || PREFS.max || 20;
    const model = MODELS.some((m) => m.id === p.mo) ? p.mo : (MODELS[0] && MODELS[0].id) || "";
    iv.s = { a: p.q.map((_, i) => (p.a && p.a[i]) || ""), x: p.x || "", f: p.fo || p.fs || made.f, m: model,
             ql: QUALITIES.some((q) => q.id === p.qo) ? p.qo : quality, va: p.va === "gleich" ? "gleich" : "vielfalt", n: clamp(p.n || 4, 1, max), max };
  }
  return iv.s;
}
function interview(dir) {
  const p = IDEA, s = ivState(), qs = p.q, steps = qs.length + 3, step = iv.step;
  setCtx(`Schritt ${step + 1} von ${steps}`);
  const goStep = (to) => { const d = to > iv.step ? 1 : -1; iv.step = to; haptic.pick(); interview(d); };
  setBack(step > 0 ? () => goStep(step - 1) : null);
  const head = `<div class="iv-head"><span class="kicker">${p.r ? "📷" : "💡"} ${esc(p.title)}</span>${BOX ? '<button class="link" id="quick">⚡ Einfach machen</button>' : ""}<button class="link danger" id="drop">Verwerfen</button></div>
    <div class="progress">${Array.from({ length: steps }, (_, i) => `<i class="${i < step ? "done" : ""}"></i>`).join("")}</div>`;
  const wire = (el) => {
    $("#drop", el).addEventListener("click", dropIdea);
    const quick = $("#quick", el);
    if (quick) quick.addEventListener("click", () => {   // ⚡ the answers as they are (my tips), straight to the pictures
      haptic.tap("medium");
      dispatch({ t: "answers", id: p.id, a: s.a, x: s.x, f: s.f, m: s.m, ql: s.ql, va: s.va, n: s.n }, { title: `💡 ${p.title} · ${plural(s.n, "Bild", "Bilder")}` });
      ideaDropped = true; IDEA = null; toast("Geht los – den Stand siehst du oben"); ideaHome();
    });
    const bar = $$(".progress i", el)[step];
    requestAnimationFrame(() => requestAnimationFrame(() => bar && bar.classList.add("done")));
  };

  if (step < qs.length) {   // ---- a question
    // every question takes several answers (and an own one on top); nothing moves on by itself
    const q = qs[step];
    const parts = s.a[step].split(", ").map((c) => c.trim()).filter(Boolean);
    const chosen = new Set(parts.filter((c) => q.o.includes(c)));
    let own = parts.filter((c) => !q.o.includes(c)).join(", ");
    const keep = () => { s.a[step] = [...q.o.filter((o) => chosen.has(o)), own.trim()].filter(Boolean).join(", "); };
    const two = q.o.every((o) => o.length <= 18);
    render(`<div>${head}
      <p class="step-no">Frage ${step + 1} von ${qs.length}</p>
      ${step === 0 && p.summary ? `<p class="summary">${esc(p.summary)}</p>` : ""}
      <h2>${esc(q.t)}</h2><p class="note">Tipp alles an, was passt – gern auch mehreres.</p>
      <div class="list${two ? " two" : ""}" id="opts" style="margin-top:16px">${q.o.map((o, k) => `<button class="opt${chosen.has(o) ? " on" : ""}" data-k="${k}">
        <span class="txt"><b>${esc(o)}</b></span>${(q.p || []).includes(o) ? '<span class="badge">Tipp</span>' : ""}<span class="check">${ICON.check}</span></button>`).join("")}</div>
      <div class="field own"><input id="own" placeholder="… und/oder eigene Antwort" value="${esc(own)}" enterkeyhint="next"></div></div>`, (el) => {
      wire(el);
      $("#opts").addEventListener("click", (e) => {
        const b = e.target.closest(".opt"); if (!b) return;
        const o = q.o[+b.dataset.k];
        if (chosen.has(o)) chosen.delete(o); else chosen.add(o);
        b.classList.toggle("on", chosen.has(o));
        haptic.pick(); keep();
      });
      const ownInput = $("#own");
      ownInput.addEventListener("input", () => { own = ownInput.value; keep(); });
      ownInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { ownInput.blur(); goStep(step + 1); } });
      setGo(step < qs.length - 1 ? "Nächste Frage" : "Nächste Seite", () => goStep(step + 1));
    }, dir);
    return;
  }

  if (step === qs.length) {   // ---- anything else?
    render(`<div>${head}
      <p class="step-no">Fast geschafft</p>
      <h2>Noch etwas, das wichtig ist?</h2>
      <p class="note">Ein Detail, ein Wunsch, ein „bitte nicht“ – oder einfach weiter.</p>
      <div class="field" style="margin-top:16px"><textarea id="x" maxlength="600" placeholder="z. B. sie trägt eine rote Brille · kein Text im Bild">${esc(s.x)}</textarea></div></div>`, (el) => {
      wire(el);
      $("#x").addEventListener("input", (e) => { s.x = e.target.value; });
      setGo("Nächste Seite", () => goStep(step + 1));
    }, dir);
    return;
  }

  if (step === qs.length + 1) {   // ---- format, model, quality, how varied, how many
    const models = MODELS.map((m) => ({ v: m.id, b: m.n, s: m.id === p.mo && p.mr ? p.mr : m.h, tip: m.id === p.mo }));
    render(`<div>${head}
      <p class="step-no">Feinschliff</p>
      <h2>${p.r ? "Qualität und Anzahl" : "Format, Modell und Anzahl"}</h2>
      ${p.r ? '<p class="note">Mit Foto: Format und Bildmodell richten sich nach deinem Foto – es wird bearbeitet, damit erkennbar bleibt, was darauf ist.</p>'
        : `<div class="label">Format</div>${formats("ivf", s.f, p.fs)}
      ${models.length > 1 ? `<div class="label">Bildmodell</div>${options("ivm", models, s.m)}` : ""}`}
      <div class="label">Qualität</div>${seg("ivq", qualityItems(), s.ql)}
      <div class="label">Wie unterschiedlich?</div>${options("ivv", VARIETY, s.va)}
      <div class="label">Wie viele Bilder?</div>
      <div class="stepper"><button id="minus" aria-label="Weniger">−</button><div class="num"><b id="n">${s.n}</b><small>höchstens ${s.max}</small></div><button id="plus" aria-label="Mehr">+</button></div>
      <div class="scroller" id="quick">${QUICK.filter((n) => n <= s.max).map((n) => `<button class="chip${n === s.n ? " on" : ""}" data-n="${n}">${n}</button>`).join("")}</div></div>`, (el) => {
      wire(el);
      pick($("#ivf"), (v) => { s.f = v; });
      pick($("#ivm"), (v) => { s.m = v; });
      pick($("#ivq"), (v) => { s.ql = v; });
      pick($("#ivv"), (v) => { s.va = v; });
      const setN = (n) => {
        s.n = clamp(n, 1, s.max);
        $("#n").textContent = s.n;
        $("#minus").disabled = s.n <= 1; $("#plus").disabled = s.n >= s.max;
        $$("#quick .chip").forEach((b) => b.classList.toggle("on", +b.dataset.n === s.n));
        haptic.pick();
      };
      $("#minus").addEventListener("click", () => setN(s.n - 1));
      $("#plus").addEventListener("click", () => setN(s.n + 1));
      $("#quick").addEventListener("click", (e) => { const b = e.target.closest("[data-n]"); if (b) setN(+b.dataset.n); });
      $("#minus").disabled = s.n <= 1; $("#plus").disabled = s.n >= s.max;
      setGo("Nächste Seite", () => goStep(step + 1));
    }, dir);
    return;
  }

  // ---- the overview, then go
  const model = (MODELS.find((m) => m.id === s.m) || { n: s.m }).n;
  const fmt = (FORMATS.find((f) => f.id === s.f) || { n: "" }).n;
  const answered = qs.map((q, i) => [q.t.replace(/\?$/, ""), s.a[i]]).filter(([, a]) => a && a.trim());
  render(`<div>${head}
    <p class="step-no">Übersicht</p>
    <h2>${esc(p.title)}</h2>
    <div class="rows" style="margin-top:14px"><dl class="dl">
      <div><dt>Bilder</dt><dd>${s.n} · ${esc(VARIETY.find((v) => v.v === s.va).b)}</dd></div>
      ${p.r ? `<div><dt>Foto</dt><dd>${plural(p.r, "Foto", "Fotos")} – wird bearbeitet</dd></div>` : `<div><dt>Format</dt><dd>${esc(s.f)} ${esc(fmt)}</dd></div>
      ${model ? `<div><dt>Modell</dt><dd>${esc(model)}</dd></div>` : ""}`}
      <div><dt>Qualität</dt><dd>${esc((QUALITIES.find((q) => q.id === s.ql) || { n: s.ql }).n)}</dd></div>
      ${answered.map(([q, a]) => `<div><dt>${esc(q)}</dt><dd>${esc(a)}</dd></div>`).join("")}
      ${s.x.trim() ? `<div><dt>Außerdem</dt><dd>${esc(s.x)}</dd></div>` : ""}
    </dl></div>
    <p class="note" style="margin-top:14px">Ich schreibe daraus die Bildbeschreibungen und lege sofort los – die Bilder kommen in den Chat.</p></div>`, (el) => {
    wire(el);
    setGo(`${plural(s.n, "Bild", "Bilder")} erstellen`, () => {
      const order = { t: "answers", id: p.id, a: s.a, x: s.x, f: s.f, m: s.m, ql: s.ql, va: s.va, n: s.n };
      if (!BOX) { send(order, `${plural(s.n, "Bild", "Bilder")} – geht los`); return; }
      dispatch(order, { title: `💡 ${p.title} · ${plural(s.n, "Bild", "Bilder")}` });
      ideaDropped = true; IDEA = null; toast("Geht los – den Stand siehst du oben"); ideaHome();
    });
  }, dir);
}
function dropIdea() {
  const yes = () => {
    const id = IDEA.id;
    ideaDropped = true;
    if (!BOX) { send({ t: "drop", id }, "Idee verworfen"); return; }
    dispatch({ t: "drop", id }, { quiet: true }); IDEA = null; toast("Idee verworfen"); ideaHome();
  };
  if (inTelegram && tg.showConfirm) { try { tg.showConfirm("Diese Idee verwerfen?", (ok) => ok && yes()); return; } catch (e) { /* older client */ } }
  if (window.confirm("Diese Idee verwerfen?")) yes();
}

      pick($("#dyf"), (v) => { dy.f = v; });
      pick($("#dyq"), (v) => { dy.q = v; });
    }
    setGo("Einstellungen speichern", () => {
      try { if (inTelegram && tg.CloudStorage) tg.CloudStorage.setItem("prefs", JSON.stringify(s)); } catch (e) { /* not stored */ }
      const order = { t: "settings", ql: s.ql, f: s.f, m: s.m, d: s.d, file: !!s.file, quick: !!s.quick, n: +s.n || 1 };
      if (dy) {
        const themes = $("#dythemes").value.split("\n").map((x) => x.trim()).filter(Boolean);
        order.dy = { on: !!dy.on, time: dy.time, src: dy.src, f: dy.f, q: dy.q, themes };
      }
      if (!BOX) { send(order, "Einstellungen gespeichert"); return; }
      dispatch(order, { quiet: true }).then((trip) => trip && toast("Gespeichert"));
    });
  });
}

/* ================= 📮 orders on their way: sent through the Briefkasten, the app stays open ================= */
const FINAL_STATES = ["done", "failed", "cancelled"];
const LIVE_STATES = ["up", "sent", "picked", "thinking", "queued", "running"];
const VIEW_RAW = (location.hash.match(/[#&]v=([A-Za-z0-9_-]+)/) || [])[1] || "";
const fromB64url = (s) => unb64(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
let viewKey = null;
async function openForMe(bytes, aad) {   // what the PC encrypted for this user (their view key from the link)
  if (!viewKey) viewKey = await crypto.subtle.importKey("raw", fromB64url(VIEW_RAW), "AES-GCM", false, ["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12), additionalData: new TextEncoder().encode(aad) },
    viewKey, bytes.slice(12)));
}
const TRIPS_KEY = "pk.trips";
let trips = (() => {
  try { return JSON.parse(localStorage.getItem(TRIPS_KEY) || "[]").filter((x) => x.id && Date.now() - x.t < 20 * 3600e3); } catch (e) { return []; }
})();
function saveTrips() {
  try { localStorage.setItem(TRIPS_KEY, JSON.stringify(trips.filter((x) => x.id).slice(0, 20))); } catch (e) { /* private mode */ }
}
async function dispatch(order, { files = [], title = "", quiet = false } = {}) {
  const trip = { key: `t${Date.now()}${Math.random()}`, id: null, token: null, title, kind: order.t, quiet, s: "up", x: "Wird gesendet …", p: 0, t: Date.now() };
  trips.unshift(trip); paintTrips();
  try {
    const prepared = [];
    for (const f of files) prepared.push(await shrink(f));
    const up = await boxUpload(order, prepared, (x) => { trip.p = x; trip.x = files.length ? `Hochladen … ${Math.round(x * 100)} %` : "Wird gesendet …"; paintTrips(); });
    Object.assign(trip, { id: up.id, token: up.token, s: "sent", x: "Im Briefkasten – dein PC holt ihn gleich ab", p: null });
    haptic.ok(); saveTrips(); paintTrips(); watchTrips();
    return trip;
  } catch (e) {
    Object.assign(trip, { s: "failed", x: e.message || "Senden ging nicht", p: null });
    haptic.tap("heavy"); paintTrips();
    if (quiet) toast(trip.x);
    return null;
  }
}
function tripClass(x) { return LIVE_STATES.includes(x.s) ? "live" : x.s === "done" || x.s === "questions" ? "ok" : "bad"; }
function paintTrips() {
  const shown = trips.filter((x) => !x.quiet && !x.gone && (!FINAL_STATES.includes(x.s) || Date.now() - (x.end || x.t) < 10 * 60e3)).slice(0, 4);
  $("#trips").innerHTML = shown.map((x) => {
    const live = LIVE_STATES.includes(x.s) && x.id && x.kind !== "idea" && x.kind !== "settings";
    return `<div class="trip ${tripClass(x)}" data-k="${esc(x.key)}"><i class="dot"></i>
      <div class="tx"><b>${esc(x.title || "Auftrag")}</b><span>${esc(x.x || "")}</span></div>
      ${live ? '<button class="act stop">Stopp</button>' : FINAL_STATES.includes(x.s) ? '<button class="act ok" aria-label="Ausblenden">✕</button>' : ""}
      ${typeof x.p === "number" ? `<i class="bar" style="--p:${x.p}"></i>` : ""}</div>`;
  }).join("");
}
$("#trips").addEventListener("click", (e) => {
  const card = e.target.closest(".trip"); if (!card) return;
  const x = trips.find((y) => y.key === card.dataset.k); if (!x) return;
  if (e.target.closest(".stop")) {
    haptic.tap("medium"); x.x = "Wird gestoppt …"; paintTrips();
    dispatch({ t: "cancel", item: x.id }, { quiet: true });
  } else if (e.target.closest(".ok")) { x.gone = true; saveTrips(); paintTrips(); }
});
let watching = 0;
function watchTrips() {
  if (watching) return;
  const tick = async () => {
    const open = trips.filter((x) => x.id && (LIVE_STATES.includes(x.s) || (x.s === "questions" && !x.used)));
    if (!open.length) { watching = 0; return; }
    for (const x of open.slice(0, 6)) {
      try {
        const st = await boxCall("GET", `/st/${x.id}`, { token: x.token });
        const changed = st.s !== x.s || st.x !== x.x || st.p !== x.p;
        Object.assign(x, { s: st.s, x: st.x || x.x, p: typeof st.p === "number" ? st.p : null });
        if (FINAL_STATES.includes(x.s) && !x.end) {
          x.end = Date.now();
          if (x.s === "done" && !x.quiet) haptic.ok();
          lib.loaded = false;   // „Meine Bilder“ loads anew next time
        }
        if (x.kind === "idea" && st.d && !x.used) await questionsArrived(x, st.d);
        if (changed) { saveTrips(); paintTrips(); }
      } catch (e) {
        if (e.status === 404) { x.s = "failed"; x.x = "Nicht mehr im Briefkasten"; x.end = Date.now(); saveTrips(); paintTrips(); }
      }
    }
    watching = setTimeout(tick, 2000);
  };
  watching = setTimeout(tick, 1200);
}
async function questionsArrived(x, data) {
  x.used = true;
  try {
    const plain = await openForMe(unb64(data), "st");
    const payload = JSON.parse(new TextDecoder().decode(plain));
    if (!payload || payload.v !== 2 || !Array.isArray(payload.q)) return;
    IDEA = payload; ideaDropped = false; iv.step = 0; iv.s = null;
    x.gone = true; haptic.ok(); toast("Deine Fragen sind da");
    openTab("idea");
  } catch (e) { toast("Die Fragen konnten nicht geöffnet werden – schick /hilfe und öffne die App neu"); }
}

/* ================= 🖼️ Meine Bilder: like CutForge's media library – the page asks, the PC answers with what is
   still on its disk (encrypted for this user); view, „In den Chat“, delete for good ================= */
const lib = { items: [], more: false, pg: 0, loading: false, loaded: false, err: "", admin: false, select: false, chosen: new Set() };
async function ask(order) {   // an order whose answer the page needs (not shown in the strip)
  const up = await boxUpload(order, [], () => {});
  for (let i = 0; ; i++) {
    const st = await boxCall("GET", `/st/${up.id}`, { token: up.token });
    if (FINAL_STATES.includes(st.s)) {
      if (st.s !== "done") throw new Error(st.x || "Das ging nicht.");
      if (!st.r) return st;
      const r = await fetch(BOX.url.replace(/\/+$/, "") + `/st/${up.id}/res`, { headers: { "X-Up-Token": up.token } });
      if (!r.ok) throw new Error("Die Antwort kam nicht an.");
      return JSON.parse(new TextDecoder().decode(await openForMe(new Uint8Array(await r.arrayBuffer()), `res:${up.id}`)));
    }
    if (i > 100) throw new Error(st.pc !== null && st.pc > 90 ? "Dein PC antwortet gerade nicht – läuft Bildstudio?" : "Keine Antwort vom PC.");
    await new Promise((ok) => setTimeout(ok, i < 10 ? 700 : 1500));
  }
}
function mine() {
  setCtx("Meine Bilder");
  if (!BOX || !VIEW_RAW) {
    render(`<div><h1>Meine <em>Bilder</em></h1><p class="lead">Öffne die App über <b>Studio</b> links neben dem Eingabefeld – dann siehst du hier alles, was du erstellt hast.</p></div>`);
    return;
  }
  lib.select = false; lib.chosen.clear();
  render(`<div><div class="mine-head"><h1>Meine <em>Bilder</em></h1><button class="link" id="sel">Auswählen</button><button class="link" id="reload">Neu laden</button></div>
    <p class="lead" id="mnote"></p><div class="grid mine" id="mgrid"></div><div id="mmore"></div></div>`, () => {
    $("#sel").addEventListener("click", () => { lib.select = !lib.select; lib.chosen.clear(); haptic.pick(); paintLib(); });
    $("#reload").addEventListener("click", () => { haptic.tap(); loadLib(0); });
    $("#mgrid").addEventListener("click", (e) => {
      const c = e.target.closest(".mcard"); if (!c) return;
      const id = +c.dataset.i;
      if (lib.select) { if (lib.chosen.has(id)) lib.chosen.delete(id); else lib.chosen.add(id); haptic.pick(); paintLib(); return; }
      openViewer(lib.items.find((it) => it.i === id));
    });
    $("#mmore").addEventListener("click", (e) => { if (e.target.closest("button")) loadLib(lib.pg + 1); });
    paintLib();
    if (!lib.loaded) loadLib(0);
  });
}
async function loadLib(pg) {
  if (lib.loading) return;
  lib.loading = true; lib.err = "";
  if (tab === "mine") paintLib();
  try {
    const a = await ask({ t: "list", pg });
    lib.items = pg ? [...lib.items, ...a.items] : a.items;
    Object.assign(lib, { more: !!a.more, pg, loaded: true, admin: !!a.admin });
  } catch (e) { lib.err = e.message || "Laden ging nicht."; }
  lib.loading = false;
  if (tab === "mine") paintLib();
}
const KIND_ICON = { video: "🎥", model: "🧊", image: "🖼️" };
const mb = (n) => n >= 1e9 ? `${(n / 1e9).toFixed(1)} GB` : n >= 1e6 ? `${(n / 1e6).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1e3))} KB`;
const libDate = (d) => { const x = new Date(d); return isNaN(x) ? "" : x.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit" }); };
function paintLib() {
  const grid = $("#mgrid"); if (!grid) return;
  const n = lib.items.length;
  const what = lib.admin ? "Alles, was auf dem PC liegt" : "Alles, was du erstellt hast und noch auf dem PC liegt";
  $("#mnote").textContent = lib.err ? lib.err : lib.loading && !n ? "Dein PC sucht deine Bilder heraus …"
    : !lib.loaded ? "" : !n ? "Noch nichts da – leg los!" : lib.select ? "Tippe an, was weg soll." : `${what}. Antippen zum Ansehen, Schicken oder Löschen.`;
  $("#sel").textContent = lib.select ? "Fertig" : "Auswählen";
  $("#sel").classList.toggle("hidden", !n);
  grid.innerHTML = lib.items.map((it) => `<button class="mcard${lib.chosen.has(it.i) ? " on" : ""}" data-i="${it.i}">
      ${it.th ? `<img class="in" src="data:image/webp;base64,${it.th}" alt="" loading="lazy">` : `<span class="emo">${KIND_ICON[it.k] || "🖼️"}</span>`}
      ${it.th && it.k !== "image" ? `<span class="kind">${KIND_ICON[it.k]}</span>` : ""}
      ${it.u ? `<span class="who">${esc(it.u)}</span>` : ""}
      ${lib.select ? `<span class="sel">${ICON.check}</span>` : ""}</button>`).join("");
  $("#mmore").innerHTML = lib.loading && n ? '<p class="empty">Lädt …</p>' : lib.more && !lib.select ? '<button class="more">Mehr laden</button>' : "";
  if (lib.select) {
    const k = lib.chosen.size;
    setGo(k ? `${plural(k, "Bild", "Bilder")} endgültig löschen` : "Bilder antippen", () => deleteChosen([...lib.chosen]), k > 0);
  } else hideGo();
}
function confirmDelete(count, yes) {
  const text = `${plural(count, "Bild", "Bilder")} endgültig löschen? Es wird auch auf dem PC gelöscht (nicht im Papierkorb) – das geht nicht rückgängig.`;
  if (inTelegram && tg.showConfirm) { try { tg.showConfirm(text, (ok) => ok && yes()); return; } catch (e) { /* older client */ } }
  if (window.confirm(text)) yes();
}
function deleteChosen(ids) {
  confirmDelete(ids.length, async () => {
    goBusy("Wird gelöscht …");
    try {
      await ask({ t: "delete", ids });
      lib.items = lib.items.filter((it) => !ids.includes(it.i));
      lib.chosen.clear(); lib.select = false; closeViewer();
      haptic.ok(); toast(`${plural(ids.length, "Bild", "Bilder")} gelöscht – auch auf dem PC`);
    } catch (e) { toast(e.message || "Löschen ging nicht"); }
    goIdle();
    if (tab === "mine") paintLib();
  });
}
function openViewer(it) {
  if (!it) return;
  const v = $("#viewer");
  const info = [libDate(it.d), it.c > 1 ? `${it.c} Dateien` : "", it.sz ? mb(it.sz) : "", it.u || ""].filter(Boolean).join(" · ");
  v.innerHTML = `${it.th ? `<img src="data:image/webp;base64,${it.th}" alt="">` : `<div class="emo" style="font-size:80px;text-align:center">${KIND_ICON[it.k] || "🖼️"}</div>`}
    <p>${esc(it.t || "Ohne Titel")}<br><small>${esc(info)}</small></p>
    <div class="row2"><button id="vsend">In den Chat</button><button class="del" id="vdel">Löschen</button></div>
    <button class="vclose" id="vclose">Schließen</button>`;
  v.classList.add("open");
  $("#vclose").addEventListener("click", closeViewer);
  $("#vdel").addEventListener("click", () => deleteChosen([it.i]));
  $("#vsend").addEventListener("click", async (e) => {
    const b = e.currentTarget; b.disabled = true; b.textContent = "Wird geschickt …";
    try { await ask({ t: "send", id: it.i }); b.textContent = "Im Chat ✓"; haptic.ok(); }
    catch (err) { b.disabled = false; b.textContent = "In den Chat"; toast(err.message || "Das ging nicht"); }
  });
  setBack(closeViewer); hideGo();
}
function closeViewer() {
  $("#viewer").classList.remove("open");
  if (tab === "mine") { setBack(null); if (lib.select) paintLib(); }
}
$("#viewer").addEventListener("click", (e) => { if (e.target.id === "viewer") closeViewer(); });

if (BOX) $("#live").classList.add("box");
paintTrips(); watchTrips();
loadFavs(() => openTab(IDEA || location.hash.includes("idee") ? "idea" : "effects"));
</script>
</body>
